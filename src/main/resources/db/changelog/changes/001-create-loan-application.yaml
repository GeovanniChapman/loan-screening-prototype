databaseChangeLog:
  - changeSet:
      id: 001-create-loan-application
      author: geo
      comment: Creates the loan_application table (aggregate root of the domain).
      changes:
        - createTable:
            tableName: loan_application
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: applicant_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: annual_income
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: requested_amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: credit_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: decision_reason
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: evaluated_at
                  type: TIMESTAMP WITH TIME ZONE
